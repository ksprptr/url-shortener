# docker-compose.yml
# Full deployment: Postgres + Redis + the API + the web app.
#
# Usage:
#   cp .env.example .env                              # infra + web settings
#   cp apps/api/.env.example apps/api/.env            # API secrets
#   docker compose up -d --build                      # build + start everything
#   docker compose logs -f url-shortener-web                   # stream logs for a service
#   docker compose down                               # stop (data survives in the volumes)
#
# Migrations run automatically on every `up` (the one-shot `url-shortener-migrate` service); the API
# only starts once they have been applied.
#
# Infra + web settings: root .env (see .env.example)
# API secrets:          apps/api/.env (see apps/api/.env.example)
#
# Postgres major version: POSTGRES_VERSION in the root .env (defaults to 18). Changing it on an
# existing instance is a dump and restore, not a version bump — see docs/upgrading-postgres.md.

services:
  url-shortener-pg:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: url-shortener-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASS}'
      POSTGRES_DB: '${DB_NAME}'
      # 18 moved the default cluster to /var/lib/postgresql/<major>/docker. Pinning PGDATA to the
      # pre-18 path keeps one volume and one mount working whichever major POSTGRES_VERSION names.
      PGDATA: '/var/lib/postgresql/data'
    ports:
      # Loopback only — nothing outside this host needs to reach the database.
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - url_shortener_pg_data:/var/lib/postgresql/data
    networks:
      - url_shortener_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  url-shortener-redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASS}']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - url_shortener_redis_data:/data
    networks:
      - url_shortener_net
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASS}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies pending Prisma migrations, then exits. Shares the API image.
  url-shortener-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: url-shortener-api
    container_name: url-shortener-migrate
    restart: 'no'
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    env_file:
      # `format: raw` disables compose's variable interpolation for this file. Without it a bcrypt
      # AUTH_PASSWORD is silently mangled: `$2b$12$BYX...` has `$BYX...` substituted as an unset
      # variable, so the API receives an invalid hash and refuses to boot.
      - path: apps/api/.env
        format: raw
    environment: &api_env
      NODE_ENV: 'production'
      # Inside the network the services talk over their container names and default ports; these
      # override apps/api/.env so the root .env stays the single source for infra credentials.
      WEB_APP_URL: '${APP_URL:-http://localhost:3000}'
      DB_HOST: 'url-shortener-pg'
      DB_PORT: '5432'
      DB_NAME: '${DB_NAME}'
      DB_USER: '${DB_USER}'
      DB_PASS: '${DB_PASS}'
      REDIS_HOST: 'url-shortener-redis'
      REDIS_PORT: '6379'
      REDIS_USER: '${REDIS_USER:-default}'
      REDIS_PASS: '${REDIS_PASS}'
      REDIS_KEY_PREFIX: '${REDIS_KEY_PREFIX:-url-shortener:}'
    networks:
      - url_shortener_net
    depends_on:
      url-shortener-pg:
        condition: service_healthy

  url-shortener-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: url-shortener-api
    container_name: url-shortener-api
    restart: unless-stopped
    env_file:
      # See url-shortener-migrate: raw, so a bcrypt AUTH_PASSWORD survives intact.
      - path: apps/api/.env
        format: raw
    environment: *api_env
    # The server only reads its own bundle; /tmp is writable for Prisma's query engine.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No published ports: the API is reached only over the compose network, as `url-shortener-api:4000` by
    # the web app. Nothing outside the network — not even the host — needs to hit it directly, and
    # not publishing it keeps a spoofed X-Forwarded-For from reaching it straight from the host.
    networks:
      - url_shortener_net
    depends_on:
      url-shortener-pg:
        condition: service_healthy
      url-shortener-redis:
        condition: service_healthy
      url-shortener-migrate:
        condition: service_completed_successfully

  url-shortener-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the prerendered metadata — build-time only.
        APP_URL: '${APP_URL:-http://localhost:3000}'
    image: url-shortener-web
    container_name: url-shortener-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: 'production'
      PORT: '3000'
      APP_URL: '${APP_URL:-http://localhost:3000}'
      # Server-to-server, over the compose network — never leaves the host.
      API_URL: 'http://url-shortener-api:4000/api/v1'
    ports:
      # Bound to loopback for a same-host reverse proxy; drop the prefix to expose it directly.
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    networks:
      - url_shortener_net
    depends_on:
      url-shortener-api:
        condition: service_healthy

volumes:
  url_shortener_pg_data:
  url_shortener_redis_data:

networks:
  url_shortener_net:
    driver: bridge
    name: url_shortener_net
